# Test profile: in-memory H2 (PostgreSQL mode), schema generated from the entities.
# Production uses PostgreSQL + Flyway; tests only need a throwaway database.
spring:
  datasource:
    url: jdbc:h2:mem:keystone-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  seed:
    enabled: true
    password: Passw0rd!
