server:
  port: ${PORT:8080}

spring:
  application:
    name: keystone
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/keystone}
    username: ${DB_USERNAME:keystone}
    password: ${DB_PASSWORD:keystone}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Lets an already-running database (created earlier by ddl-auto) adopt Flyway
    # without re-creating tables. A brand-new empty database runs V1 normally.
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          # fail fast instead of hanging if the SMTP server is unreachable
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  seed:
    enabled: ${SEED_ENABLED:true}
    password: ${SEED_PASSWORD:Passw0rd!}
  mail:
    # The dummy/project-only mailbox this app sends from - never your personal email.
    from: ${MAIL_FROM:noreply@keystone.dev}
    # If set, emails go over HTTPS (Brevo API) instead of SMTP - required on hosts that block SMTP ports (Render free tier).
    brevo-api-key: ${BREVO_API_KEY:}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:this-is-a-very-long-development-only-secret-key-change-me-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  sla:
    critical-hours: 4
    high-hours: 8
    medium-hours: 24
    low-hours: 72

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.zidio.keystone: INFO
